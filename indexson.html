<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f6f5f2"><meta name="apple-mobile-web-app-capable" content="yes"><title>Focus Studio — Your time, beautifully</title><style>
:root{--bg:#f6f5f2;--fg:#20201f;--muted:#85837f;--card:#e9e8e5;--line:#d6d4cf;--accent:#77746c;--glass:rgba(255,255,255,.58)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;transition:background .35s,color .35s;min-height:100dvh}body.dark{--bg:#111113;--fg:#f3f1ed;--muted:#a4a1a0;--card:#29292c;--line:#454548;--accent:#d0c8b9;--glass:rgba(40,40,42,.72)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #a99d7e;outline-offset:3px}.shell{max-width:1200px;margin:auto;padding:24px clamp(18px,4vw,52px) 34px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:13px;letter-spacing:.24em;font-weight:750}.subtitle{font-size:11px;letter-spacing:.1em;color:var(--muted);margin-top:6px}.topactions{display:flex;gap:9px}.iconbtn{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:100px;padding:10px 14px}.modes{display:flex;gap:8px;overflow-x:auto;padding:22px 0 8px;scrollbar-width:none}.modes::-webkit-scrollbar{display:none}.mode{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--muted);padding:10px 17px;border-radius:99px;font-size:13px}.mode.active{background:var(--fg);color:var(--bg);border-color:var(--fg)}.stage{min-height:min(58vh,550px);display:grid;place-items:center;position:relative;overflow:hidden;border-radius:28px;margin-top:12px;background:var(--glass);border:1px solid var(--line);padding:26px}.scene{display:none;width:100%;height:100%;min-height:350px;place-items:center;position:relative}.scene.active{display:grid}.flipclock{display:flex;align-items:center;gap:clamp(6px,2vw,22px);justify-content:center;width:100%}.flipgroup{display:flex;gap:clamp(3px,.7vw,9px)}.tile{width:clamp(55px,11vw,145px);height:clamp(112px,22vw,255px);border-radius:clamp(8px,2vw,19px);background:linear-gradient(#ebebea 0 49.4%,#dededd 49.5% 50.5%,#e6e6e5 50.6%);color:#242424;position:relative;display:grid;place-items:center;box-shadow:0 3px 6px #0000000a;overflow:hidden}.dark .tile{background:linear-gradient(#27272a 0 49.4%,#141416 49.5% 50.5%,#222225 50.6%);color:#f6f5f2}.tile:after{content:'';position:absolute;top:50%;left:0;right:0;border-top:2px solid rgba(0,0,0,.12);z-index:2}.tile span{font-family:Arial,Helvetica,sans-serif;font-size:clamp(82px,17vw,215px);font-weight:800;letter-spacing:-.095em;line-height:1;transform:translateX(-.04em)}.tile.turn span{animation:flip .38s ease}@keyframes flip{0%{transform:translateX(-.04em) scaleY(.94);opacity:.7}100%{transform:translateX(-.04em) scaleY(1);opacity:1}}.colon{font-size:clamp(32px,6vw,74px);font-weight:300;transform:translateY(-8px)}.scene-caption{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.16em;text-transform:uppercase}.arttime{font-weight:300;font-size:clamp(45px,8vw,110px);letter-spacing:-.055em;font-variant-numeric:tabular-nums;position:relative;z-index:4}.artscene{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px}.orbwrap{position:relative;width:min(56vw,290px);height:min(56vw,290px);display:grid;place-items:center}.orb{width:70%;height:70%;border-radius:50%;box-shadow:0 0 75px #f3b64d80;background:radial-gradient(circle at 32% 28%,#fff4bc,#f9c36d 55%,#dc805b);transition:transform .3s}.horizon{width:min(75vw,520px);height:2px;background:currentColor;opacity:.3;position:absolute;top:56%;z-index:3}.sky{background:linear-gradient(180deg,#d9e5f2,#f5e5d1 78%,#f6d9c6);color:#3b3a42}.dark .sky{background:linear-gradient(180deg,#202a47,#78657b 80%,#b87b75);color:#f7eae5}.moonstage{background:radial-gradient(circle at 50% 43%,#283247,#0b1220 78%);color:#fff}.moonorb{width:70%;height:70%;border-radius:50%;background:#f4efe2;box-shadow:0 0 65px #dbe6fa45;position:relative;overflow:hidden}.moonshade{position:absolute;inset:0;background:#20283a;border-radius:50%;transform:translateX(100%)}.stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 10% 20%,white 90%,transparent),radial-gradient(2px 2px at 80% 15%,white 90%,transparent),radial-gradient(1px 1px at 75% 80%,white 90%,transparent),radial-gradient(2px 2px at 23% 73%,white 90%,transparent);opacity:.8}.coffee-stage{background:#e9ded1;color:#47372c}.dark .coffee-stage{background:#29211d;color:#e9d4c1}.cup{width:min(56vw,260px);height:min(40vw,190px);border:9px solid currentColor;border-radius:12px 12px 85px 85px;position:relative;overflow:visible}.cup:after{content:'';position:absolute;width:65px;height:85px;border:10px solid currentColor;border-radius:0 55px 55px 0;left:calc(100% + 4px);top:12px}.coffee-liquid{position:absolute;left:0;right:0;bottom:0;height:100%;background:linear-gradient(135deg,#9c694c,#5c382a);border-radius:0 0 72px 72px;transition:height .4s}.coffee-stage .arttime{font-size:clamp(42px,7vw,88px)}.money-stage{background:#e1e8da;color:#263b2e}.dark .money-stage{background:#1e2a23;color:#e3eddf}.coin{width:min(48vw,215px);height:min(48vw,215px);border-radius:50%;border:12px double #b9964e;background:radial-gradient(circle at 35% 30%,#ffeab2,#c69b4d);display:grid;place-items:center;color:#6f5025;font-size:clamp(70px,14vw,145px);font-weight:500;box-shadow:0 12px 0 #aa843c,0 20px 30px #0002;transition:transform .3s}.moneycount{font-size:14px;letter-spacing:.16em}.photo-stage{background:#1b1a1a;color:white}.photo-frame{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.3s ease;animation:kenburns 22s ease-in-out infinite alternate}.photo-frame.visible{opacity:1}@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.1)}}.photo-stage:after{content:'';position:absolute;inset:0;background:#0006}.photo-stage .arttime{text-shadow:0 3px 25px #0008}.photo-controls{position:absolute;bottom:42px;z-index:5;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.photo-controls label,.photo-controls button{background:#ffffffbd;border:0;color:#222;border-radius:99px;padding:9px 12px;font-size:12px;cursor:pointer}.photo-controls input{display:none}.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin:25px 0 13px}.primary{background:var(--fg);color:var(--bg);border:1px solid var(--fg);border-radius:99px;padding:15px 34px;font-weight:650;min-width:160px}.secondary{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:99px;padding:14px 20px}.settings{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap}.settings input{width:76px;border:1px solid var(--line);border-radius:12px;padding:12px;background:transparent;color:var(--fg);text-align:center}.settings label{font-size:12px;color:var(--muted)}.status{text-align:center;color:var(--muted);font-size:12px;margin-top:18px;min-height:20px}.footer{text-align:center;color:var(--muted);font-size:11px;letter-spacing:.1em;margin-top:24px}.progress{height:3px;background:var(--line);border-radius:5px;overflow:hidden;margin:20px auto 0;max-width:540px}.progress div{height:100%;background:var(--fg);width:0%;transition:width .5s}.fullscreen .shell{max-width:none}.fullscreen .top,.fullscreen .modes,.fullscreen .controls,.fullscreen .settings,.fullscreen .footer,.fullscreen .progress,.fullscreen .status{display:none}.fullscreen .stage{height:100dvh;margin:0;border:0;border-radius:0}.fullscreen .shell{padding:0}.fullscreen .scene{height:100%}.fullscreen .flipclock .tile{width:clamp(58px,13vw,190px);height:clamp(110px,23vw,290px)}.exitfs{display:none;position:fixed;right:18px;top:18px;z-index:20}.fullscreen .exitfs{display:block}@media(max-width:600px){.shell{padding:18px 12px}.stage{min-height:420px;padding:12px}.tile{width:clamp(38px,11.2vw,70px);height:clamp(85px,22vw,140px)}.tile span{font-size:clamp(65px,17vw,115px)}.flipclock{gap:5px}.colon{font-size:30px}.scene{min-height:390px}.top{padding:0 6px}.brand{font-size:12px}.iconbtn{padding:9px 11px}}
</style></head><body><button class="iconbtn exitfs" id="exitfs">✕ Exit</button><main class="shell"><header class="top"><div><div class="brand">FOCUS STUDIO</div><div class="subtitle">YOUR TIME, BEAUTIFULLY.</div></div><div class="topactions"><button class="iconbtn" id="sound" title="Звук">♫ On</button><button class="iconbtn" id="theme" title="Сменить тему">◐ Theme</button><button class="iconbtn" id="fullscreen" title="На весь экран">⛶</button></div></header><nav class="modes" id="modes"><button class="mode active" data-mode="flip">01 Flip clock</button><button class="mode" data-mode="photo">02 Photos</button><button class="mode" data-mode="sun">03 Sunrise</button><button class="mode" data-mode="moon">04 Moon</button><button class="mode" data-mode="coffee">05 Coffee</button><button class="mode" data-mode="money">06 Money</button></nav><section class="stage" id="stage"><div class="scene active" data-scene="flip"><div class="flipclock" id="flipclock"></div><div class="scene-caption">Time remaining</div></div><div class="scene photo-stage" data-scene="photo"><div class="photo-frame visible" id="photo1"></div><div class="photo-frame" id="photo2"></div><div class="arttime" data-time></div><div class="photo-controls"><label>＋ Photo 1<input type="file" accept="image/*" id="upload1"></label><label>＋ Photo 2<input type="file" accept="image/*" id="upload2"></label><button id="nextphoto">Change photo ↗</button></div></div><div class="scene sky" data-scene="sun"><div class="artscene"><div class="orbwrap"><div class="orb" id="sunorb"></div><div class="horizon"></div></div><div class="arttime" data-time></div></div><div class="scene-caption">A little closer to the light</div></div><div class="scene moonstage" data-scene="moon"><div class="stars"></div><div class="artscene"><div class="orbwrap"><div class="moonorb"><div class="moonshade" id="moonshade"></div></div></div><div class="arttime" data-time></div></div><div class="scene-caption" style="color:#b6b8c5">One phase at a time</div></div><div class="scene coffee-stage" data-scene="coffee"><div class="artscene"><div class="cup"><div class="coffee-liquid" id="coffee-liquid"></div></div><div class="arttime" data-time></div></div><div class="scene-caption">A warm reward awaits</div></div><div class="scene money-stage" data-scene="money"><div class="artscene"><div class="coin" id="coin">$</div><div class="moneycount" id="moneycount">0% INVESTED IN YOURSELF</div><div class="arttime" data-time></div></div><div class="scene-caption">Every minute compounds</div></div></section><div class="progress"><div id="progress"></div></div><div class="controls"><button class="secondary" id="minus">− 5 min</button><button class="primary" id="start">Start focus</button><button class="secondary" id="plus">＋ 5 min</button><button class="secondary" id="reset">Reset</button></div><div class="settings"><label>Hours <input id="hours" type="number" min="0" max="99" value="2" inputmode="numeric"></label><label>Minutes <input id="minutes" type="number" min="0" max="59" value="0" inputmode="numeric"></label><button class="secondary" id="apply">Set time</button><button class="secondary" id="preset25">25 min</button><button class="secondary" id="preset60">1 hour</button><button class="secondary" id="preset120">2 hours</button></div><div class="status" id="status">Choose your time. Make it yours.</div><div class="footer">FOCUS STUDIO · MADE FOR QUIET MOMENTS</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const all=s=>document.querySelectorAll(s);const KEY='focus-studio-v1';let state={duration:7200,remaining:7200,endAt:null,running:false,mode:'flip',dark:false,sound:true,photoIndex:0};try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');state={...state,...saved};}catch{}let urls=[null,null],audioCtx=null;function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function seconds(){return state.running?Math.max(0,Math.ceil((state.endAt-Date.now())/1000)):state.remaining}function fmt(n){let h=Math.floor(n/3600),m=Math.floor(n%3600/60),s=n%60;return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':')}function tone(){if(!state.sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();[0,.25,.5,.85].forEach((t,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=[523,659,784,1047][i];g.gain.setValueAtTime(.0001,audioCtx.currentTime+t);g.gain.exponentialRampToValueAtTime(.17,audioCtx.currentTime+t+.03);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+t+.3);o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+t);o.stop(audioCtx.currentTime+t+.31)})}catch{}}function flip(n){let str=fmt(n).replaceAll(':','');const target=$('flipclock');if(!target.children.length){target.innerHTML='<div class="flipgroup"></div><span class="colon">:</span><div class="flipgroup"></div><span class="colon">:</span><div class="flipgroup"></div>';for(let i=0;i<6;i++){let d=document.createElement('div');d.className='tile';d.innerHTML='<span>0</span>';target.children[Math.floor(i/2)*2].append(d)}}const tiles=target.querySelectorAll('.tile');tiles.forEach((el,i)=>{let s=el.querySelector('span');if(s.textContent!==str[i]){s.textContent=str[i];el.classList.remove('turn');void el.offsetWidth;el.classList.add('turn')}})}function render(){let n=seconds();if(state.running&&n===0){state.running=false;state.remaining=0;state.endAt=null;tone();save();$('status').textContent='Session complete. Beautiful work ✨'}flip(n);all('[data-time]').forEach(x=>x.textContent=fmt(n));let p=state.duration?Math.min(1,Math.max(0,1-n/state.duration)):0;$('progress').style.width=(p*100)+'%';$('sunorb').style.transform=`translateY(${(1-p)*75}px)`;$('moonshade').style.transform=`translateX(${p*105-5}%)`;$('coffee-liquid').style.height=((1-p)*100)+'%';$('coin').style.transform=`rotate(${p*360}deg)`;$('moneycount').textContent=Math.round(p*100)+'% INVESTED IN YOURSELF';$('start').textContent=state.running?'Pause':n===0?'Start again':n<state.duration?'Continue':'Start focus';if(state.running)$('status').textContent='Your focus session is in progress';else if(n>0)$('status').textContent='Take your time. You are doing enough.'}function setTime(n){n=Math.max(1,Math.min(359999,Math.round(n)));state.duration=n;state.remaining=n;state.running=false;state.endAt=null;$('hours').value=Math.floor(n/3600);$('minutes').value=Math.floor(n%3600/60);save();render()}function adjust(delta){let n=Math.max(1,seconds()+delta);state.duration=Math.max(n,state.duration+delta);state.remaining=n;if(state.running)state.endAt=Date.now()+n*1000;save();render()}$('start').onclick=()=>{if(state.running){state.remaining=seconds();state.running=false;state.endAt=null}else{if(seconds()===0){state.remaining=state.duration}state.endAt=Date.now()+state.remaining*1000;state.running=true;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch{}}save();render()};$('reset').onclick=()=>setTime(state.duration);$('plus').onclick=()=>adjust(300);$('minus').onclick=()=>adjust(-300);$('apply').onclick=()=>setTime((Number($('hours').value)||0)*3600+(Number($('minutes').value)||0)*60);$('preset25').onclick=()=>setTime(1500);$('preset60').onclick=()=>setTime(3600);$('preset120').onclick=()=>setTime(7200);function selectMode(mode){state.mode=mode;all('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));all('.scene').forEach(s=>s.classList.toggle('active',s.dataset.scene===mode));save();render()}all('.mode').forEach(b=>b.onclick=()=>selectMode(b.dataset.mode));function theme(){document.body.classList.toggle('dark',state.dark);$('theme').textContent=state.dark?'☼ Light':'◐ Dark'}$('theme').onclick=()=>{state.dark=!state.dark;theme();save()};$('sound').onclick=()=>{state.sound=!state.sound;$('sound').textContent=state.sound?'♫ On':'♫ Off';save()};function fullscreen(on){document.body.classList.toggle('fullscreen',on);if(on&&document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(()=>{})}else if(!on&&document.fullscreenElement){document.exitFullscreen().catch(()=>{})}}$('fullscreen').onclick=()=>fullscreen(true);$('exitfs').onclick=()=>fullscreen(false);document.addEventListener('keydown',e=>{if(e.key==='Escape')fullscreen(false)});function showPhoto(){[1,2].forEach((i)=>$('photo'+i).classList.toggle('visible',state.photoIndex===i-1))}function nextPhoto(){state.photoIndex=1-state.photoIndex;showPhoto();save()}$('nextphoto').onclick=nextPhoto;[1,2].forEach(i=>{$('upload'+i).onchange=e=>{let f=e.target.files?.[0];if(!f)return;if(urls[i-1])URL.revokeObjectURL(urls[i-1]);urls[i-1]=URL.createObjectURL(f);$('photo'+i).style.backgroundImage=`url("${urls[i-1]}")`;state.photoIndex=i-1;showPhoto();$('status').textContent='Photo loaded for this visit. Re-upload after refreshing.'}});setInterval(()=>{if(state.mode==='photo'&&urls[0]&&urls[1])nextPhoto()},15000);setInterval(render,250);window.addEventListener('pagehide',save);if(state.running&&seconds()===0){state.running=false;state.remaining=0}theme();$('sound').textContent=state.sound?'♫ On':'♫ Off';$('hours').value=Math.floor(state.duration/3600);$('minutes').value=Math.floor(state.duration%3600/60);selectMode(state.mode);render()})();
</script></body></html>
